                        <div className="text-2xl font-black text-[#ef4444] mt-1">${roiCalculations.totalBleed.toLocaleString()}</div>
                        <div className="text-[10px] text-[#94a3b8] mt-1">${roiCalculations.monthlyBleed}/month perpetual cost</div>
                      </div>

                      <div className="bg-[#0a0a0c] p-4 rounded border border-[#10b981]/40">
                        <div className="text-[10px] text-[#10b981] font-bold uppercase">SOHO Vault Rack Cost</div>
                        <div className="text-2xl font-black text-[#10b981] mt-1">$7,800</div>
                        <div className="text-[10px] text-[#94a3b8] mt-1">One-time capital expense (100% owned)</div>
                      </div>
                    </div>

                    <div className="p-4 bg-[#0a0a0c] border border-[#262630] rounded space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-[#94a3b8]">Net Capital Saved ({roiInputs.years} Years):</span>
                        <span className={`font-black text-sm ${roiCalculations.netSavings >= 0 ? 'text-[#10b981]' : 'text-[#ef4444]'}`}>
                          ${roiCalculations.netSavings.toLocaleString()}
                        </span>
                      </div>
                      <div className="flex justify-between items-center text-xs">
                        <span className="text-[#94a3b8]">Break-Even Timeline:</span>
                        <span className="font-bold text-[#00e5ff]">
                          {roiCalculations.breakEvenMonths} Months
                        </span>
                      </div>
                    </div>

                    <p className="text-xs text-[#94a3b8] leading-relaxed">
                      By transitioning to localized hardware, you stop paying monthly rent for your own life while gaining 10x faster 10Gbps local network speeds and absolute data sovereignty.
                    </p>
                  </div>

                  <button
                    onClick={() => setActiveTab('tiers')}
                    className="w-full py-3 bg-[#00e5ff] hover:bg-[#00b8cc] text-[#0a0a0c] font-black text-xs uppercase tracking-wider rounded transition-all shadow-[0_0_15px_rgba(0,229,255,0.3)]"
                  >
                    Build Your Fixed-Rate Rack
                  </button>
                </div>

              </div>

            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-[#262630] bg-[#0a0a0c] py-12 mt-20 text-xs text-[#94a3b8]">
            <div className="max-w-7xl mx-auto px-4 lg:px-8 space-y-4">
              <div className="p-4 bg-[#121216] border border-[#262630] rounded-lg">
                <span className="text-[#00e5ff] font-bold">🤖 Radical Transparency Note:</span> Built with AI assistance and expert web dev skills so I can spend more time with my family! Hardware is my trade—AI was my shortcut home for dinner.
              </div>
              <div>© 2026 STEELE CO. All Rights Reserved.</div>
            </div>
          </footer>

          {/* ========================================================================= */}
          {/* MODAL 1: REQUEST DEPLOYMENT QUOTE                                         */}
          {/* ========================================================================= */}
          {quoteModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#0a0a0c]/80 backdrop-blur-sm flex justify-center items-center p-4">
              <div className="bg-[#121216] border border-[#00e5ff] rounded-xl max-w-md w-full p-6 space-y-6 shadow-[0_0_30px_rgba(0,229,255,0.2)]">
                <div className="flex justify-between items-center border-b border-[#262630] pb-3">
                  <div className="font-bold text-white text-sm uppercase flex items-center gap-2">
                    <Shield className="w-4 h-4 text-[#00e5ff]" />
                    <span>Secure Space // Deployment Intake</span>
                  </div>
                  <button 
                    onClick={() => setQuoteModalOpen(false)}
                    className="text-[#94a3b8] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <p className="text-xs text-[#94a3b8]">
                  Zero high-pressure sales calls. Submit your installation parameters to receive a published hardware bill of materials.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  alert('Deployment request submitted successfully! A technician will send your published BOM directly.');
                  setQuoteModalOpen(false);
                }} className="space-y-4 text-xs">
                  <div>
                    <label className="text-[10px] font-bold text-[#94a3b8] uppercase">Contact Name / Business Title</label>
                    <input required type="text" placeholder="John Doe" className="w-full mt-1 p-2 bg-[#0a0a0c] border border-[#262630] rounded text-white focus:border-[#00e5ff] outline-none" />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-[#94a3b8] uppercase">Email Address (Secure Intake)</label>
                    <input required type="email" placeholder="john@domain.com" className="w-full mt-1 p-2 bg-[#0a0a0c] border border-[#262630] rounded text-white focus:border-[#00e5ff] outline-none" />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-[#94a3b8] uppercase">Deployment Target Environment</label>
                    <select className="w-full mt-1 p-2 bg-[#0a0a0c] border border-[#262630] rounded text-white focus:border-[#00e5ff] outline-none">
                      <option>Tier 1: Sovereign Desk Node ($2,450)</option>
                      <option>Tier 2: Enterprise SOHO Vault ($7,800)</option>
                      <option>Tier 3: Omniscient Home Core ($18,500)</option>
                      <option>Server Closet Rescue Package ($1,250)</option>
                      <option>Physical Network Security Audit ($850)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-[#94a3b8] uppercase">Site Installation Notes / Location</label>
                    <textarea rows="3" placeholder="Residential closet, commercial office rack, existing copper runs..." className="w-full mt-1 p-2 bg-[#0a0a0c] border border-[#262630] rounded text-white focus:border-[#00e5ff] outline-none"></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-[#00e5ff] text-[#0a0a0c] font-black uppercase text-xs rounded hover:bg-[#00b8cc] transition-all"
                  >
                    Submit Direct Intake Request
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* MODAL 2: "NO DATA, NO FEE" TRADE CONTRACT CODE                            */}
          {/* ========================================================================= */}
          {contractModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#0a0a0c]/80 backdrop-blur-sm flex justify-center items-center p-4">
              <div className="bg-[#121216] border border-[#262630] rounded-xl max-w-lg w-full p-6 space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#262630] pb-3">
                  <div className="font-bold text-white text-sm uppercase flex items-center gap-2">
                    <FileText className="w-4 h-4 text-[#10b981]" />
                    <span>Steele Co. Trade Code & "No Data, No Fee" Policy</span>
                  </div>
                  <button 
                    onClick={() => setContractModalOpen(false)}
                    className="text-[#94a3b8] hover:text-white"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div className="text-xs text-[#94a3b8] space-y-3 font-mono leading-relaxed">
                  <p className="text-white font-bold">UNYIELDING SERVICE CONTRACT GUARANTEE:</p>
                  <p>
                    1. <strong className="text-[#e2e8f0]">NO HIDDEN RETAINERS:</strong> Every diagnostic check, cable routing, and server build is executed under a published flat-rate matrix. If unexpected hardware is needed, client approval is mandatory prior to installation.
                  </p>
                  <p>
                    2. <strong className="text-[#e2e8f0]">NO DATA, NO FEE GUARANTEE:</strong> If Steele Co. deploys a localized backup remediation vault or failover array, and your localized recovery system fails to successfully restore during final verification testing, execution labor costs are $0.
                  </p>
                  <p>
                    3. <strong className="text-[#e2e8f0]">ROOT HARDWARE ACCESS:</strong> Clients receive complete administrative root credentials for all firewalls, NAS vaults, and AI containers. Steele Co. maintains zero master backdoors.
                  </p>
                </div>

                <button
                  onClick={() => setContractModalOpen(false)}
                  className="w-full py-2.5 bg-[#181820] hover:bg-[#22222e] text-[#00e5ff] border border-[#00e5ff]/40 font-bold text-xs uppercase rounded transition-all"
                >
                  Acknowledge Trade Code
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
