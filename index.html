${constituentForm.name}

          )}

          {fullDraftModalOpen && (
            <div className="fixed inset-0 z-50 bg-[#0a0a0c]/95 backdrop-blur-md flex justify-center items-center p-4 overflow-y-auto">
              <div className="bg-[#121216] border-2 border-[#f59e0b] rounded-xl max-w-4xl w-full p-6 space-y-6">
                <div className="flex justify-between items-center border-b border-[#262630] pb-3">
                  <div className="text-sm font-bold text-[#f59e0b] uppercase">SDI Act Master Draft (2026)</div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setPdfNoticeOpen(true)} className="bg-[#f59e0b] text-[#0a0a0c] font-black px-3 py-1.5 rounded text-xs uppercase flex items-center gap-1">
                      <Download className="w-3.5 h-3.5" />
                      <span>Download PDF</span>
                    </button>
                    <button onClick={() => setFullDraftModalOpen(false)} className="text-[#94a3b8] hover:text-white">
                      <X className="w-5 h-5" />
                    </button>
                  </div>
                </div>
                <p className="text-xs text-[#94a3b8]">Full statutory draft loaded cleanly.</p>
              </div>
            </div>
          )}

          {pdfNoticeOpen && (
            <div className="fixed inset-0 z-50 bg-[#0a0a0c]/90 backdrop-blur-md flex justify-center items-center p-4">
              <div className="bg-[#121216] border border-[#f59e0b] rounded-xl max-w-md w-full p-6 space-y-6 text-center">
                <div className="text-sm font-bold text-[#f59e0b] uppercase">[ SYSTEM NOTICE // CODING IN PROGRESS ]</div>
                <p className="text-xs text-[#94a3b8] leading-relaxed">
                  The statutory PDF compilation system is currently offline for remote rendering. The physical document download link will be attached shortly.
                </p>
                <button onClick={() => setPdfNoticeOpen(false)} className="w-full py-2 bg-[#181820] text-white rounded text-xs uppercase">
                  Return to Core Vault
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
